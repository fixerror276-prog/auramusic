plugins {
    id 'com.android.application'
}

def appUrl = (project.findProperty('appUrl') ?: '').toString().trim()
def buildNumber = Integer.parseInt((project.findProperty('buildNumber') ?: '1').toString())

android {
    namespace 'com.auramusic.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.auramusic.app'
        minSdk 24
        targetSdk 34
        versionCode = buildNumber
        versionName '1.0'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    // A fixed key, so a newer APK installs over the older one instead of failing.
    signingConfigs {
        release {
            storeFile file('../aura.keystore')
            storePassword 'auramusic123'
            keyAlias 'aura'
            keyPassword 'auramusic123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
